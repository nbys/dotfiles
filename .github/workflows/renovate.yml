name: Update pinned versions

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Check for updates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.12
        with:
          additional-env-list: |
            RENOVATE_REPORT_PATH
            RENOVATE_REPORT_TYPE
          renovate-version: 44.223.1
          token: ${{ secrets.RENOVATE_TOKEN || github.token }}
        env:
          LOG_LEVEL: info
          RENOVATE_PLATFORM: github
          RENOVATE_REPORT_PATH: /tmp/renovate-report.json
          RENOVATE_REPORT_TYPE: file
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"

      - name: Publish dependency overview
        if: always()
        shell: bash
        run: |
          {
            echo "## Renovate dependency overview"
            echo
            echo "| Dependency | Current | Available update | Result | Update policy | File |"
            echo "| --- | --- | --- | --- | --- | --- |"

            if [[ ! -s /tmp/renovate-report.json ]]; then
              echo "| — | — | — | Renovate did not produce a report | — | — |"
            else
              rows="$(
                jq -r --slurpfile renovate_config renovate.json '
                  def md:
                    tostring
                    | gsub("\\|"; "\\\\|")
                    | gsub("[\\r\\n]"; " ");

                  def approval_types($dep; $datasource):
                    [
                      $renovate_config[0].packageRules[]?
                      | select(.dependencyDashboardApproval? == true)
                      | select(
                          ((.matchPackageNames? // []) | length) == 0
                          or ((.matchPackageNames // []) | index($dep)) != null
                        )
                      | select(
                          ((.matchDatasources? // []) | length) == 0
                          or ((.matchDatasources // []) | index($datasource)) != null
                        )
                      | .matchUpdateTypes[]?
                    ]
                    | unique;

                  def release_line($version):
                    try (
                      $version
                      | capture("^(?<prefix>v?)(?<major>[0-9]+)\\.(?<minor>[0-9]+)")
                      | "\(.prefix)\(.major).\(.minor).x"
                    ) catch $version;

                  .repositories[]?.packageFiles
                  | to_entries[]
                  | .value[]
                  | .packageFile as $packageFile
                  | .deps[]
                  | (.depName // .packageName // "unknown") as $dep
                  | (.datasource // "") as $datasource
                  | (.currentValue // .currentVersion // "unknown") as $current
                  | (.updates // []) as $updates
                  | approval_types($dep; $datasource) as $approvalTypes
                  | (
                      if ($updates | length) == 0 then
                        "—"
                      else
                        [$updates[] | (.newValue // .newVersion // "unknown")]
                        | unique
                        | join("<br>")
                      end
                    ) as $available
                  | (
                      if .skipReason? then
                        "Skipped: " + .skipReason
                      elif ($updates | length) == 0 then
                        "Up to date"
                      else
                        [$updates[] | (.updateType // "update")] | unique | join(", ")
                      end
                    ) as $result
                  | (
                      if ($approvalTypes | length) == 0 then
                        "—"
                      else
                        "Held on \(release_line($current)); "
                        + ($approvalTypes | join("/"))
                        + " updates require dashboard approval"
                      end
                    ) as $policy
                  | "| \($dep | md)"
                    + " | \($current | md)"
                    + " | \($available | md)"
                    + " | \($result | md)"
                    + " | \($policy | md)"
                    + " | \($packageFile | md) |"
                ' /tmp/renovate-report.json | sort -u
              )"

              if [[ -n "$rows" ]]; then
                echo "$rows"
              else
                echo "| — | — | — | No dependencies were extracted; see problems below | — | — |"
              fi

              problems="$(
                jq -r '
                  [
                    .problems[]?,
                    .repositories[]?.problems[]?
                  ]
                  | unique_by(.msg)
                  | .[]
                  | "- " + (.msg // "Unknown Renovate problem")
                ' /tmp/renovate-report.json
              )"

              if [[ -n "$problems" ]]; then
                echo
                echo "### Renovate problems"
                echo
                echo "$problems"
              fi
            fi

            echo
            echo "Generated from Renovate's JSON report."
          } >> "$GITHUB_STEP_SUMMARY"

