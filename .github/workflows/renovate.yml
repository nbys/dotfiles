name: Update pinned versions

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Check for updates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.12
        with:
          additional-env-list: |
            RENOVATE_REPORT_PATH
            RENOVATE_REPORT_TYPE
          renovate-version: 44.223.1
          token: ${{ secrets.RENOVATE_TOKEN || github.token }}
        env:
          LOG_LEVEL: info
          RENOVATE_PLATFORM: github
          RENOVATE_REPORT_PATH: /tmp/renovate-report.json
          RENOVATE_REPORT_TYPE: file
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"

      - name: Publish dependency overview
        if: always()
        shell: bash
        run: |
          {
            echo "## Renovate dependency overview"
            echo
            echo "| Dependency | Current | Available update | Result | File |"
            echo "| --- | --- | --- | --- | --- |"

            if [[ ! -s /tmp/renovate-report.json ]]; then
              echo "| — | — | — | Renovate did not produce a report | — |"
            else
              rows="$(
                jq -r '
                  def md:
                    tostring
                    | gsub("\\|"; "\\\\|")
                    | gsub("[\\r\\n]"; " ");

                  .repositories[]?.packageFiles
                  | to_entries[]
                  | .value[]
                  | .packageFile as $packageFile
                  | .deps[]
                  | (.updates // []) as $updates
                  | (
                      if ($updates | length) == 0 then
                        "—"
                      else
                        [$updates[] | (.newValue // .newVersion // "unknown")]
                        | unique
                        | join("<br>")
                      end
                    ) as $available
                  | (
                      if .skipReason? then
                        "Skipped: " + .skipReason
                      elif ($updates | length) == 0 then
                        "Up to date"
                      elif any($updates[]; .dependencyDashboardApproval? == true) then
                        ([$updates[] | (.updateType // "update")] | unique | join(", "))
                        + " — awaiting dashboard approval"
                      else
                        [$updates[] | (.updateType // "update")] | unique | join(", ")
                      end
                    ) as $result
                  | "| \((.depName // .packageName // "unknown") | md)"
                    + " | \((.currentValue // .currentVersion // "unknown") | md)"
                    + " | \($available | md)"
                    + " | \($result | md)"
                    + " | \($packageFile | md) |"
                ' /tmp/renovate-report.json | sort -u
              )"

              if [[ -n "$rows" ]]; then
                echo "$rows"
              else
                echo "| — | — | — | No dependencies were extracted | — |"
              fi
            fi

            echo
            echo "Generated from Renovate's JSON report."
          } >> "$GITHUB_STEP_SUMMARY"

