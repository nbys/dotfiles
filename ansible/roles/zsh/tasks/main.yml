---
- name: Install Zsh
  ansible.builtin.package:
    name: zsh
    state: present

- name: Install Oh My Zsh
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "/home/{{ target_user.stdout }}/.oh-my-zsh"
    depth: 1
    update: false
  become: true
  become_user: "{{ target_user.stdout }}"

- name: Install Zsh plugins
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "/home/{{ target_user.stdout }}/.oh-my-zsh/custom/plugins/{{ item.name }}"
    depth: 1
    update: false
  loop:
    - name: zsh-autosuggestions
      repo: https://github.com/zsh-users/zsh-autosuggestions.git
    - name: zsh-syntax-highlighting
      repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
  become: true
  become_user: "{{ target_user.stdout }}"

- name: Link Zsh environment configuration into the home directory
  ansible.builtin.file:
    src: "/home/{{ target_user.stdout }}/.config/zsh/.zshenv"
    dest: "/home/{{ target_user.stdout }}/.zshenv"
    state: link
    owner: "{{ target_user.stdout }}"
    group: "{{ target_user.stdout }}"
