---
- name: Install Zsh and Git
  ansible.builtin.package:
    name:
      - git
      - zsh
    state: present
  when: ansible_facts['os_family'] != "Darwin"

- name: Install Oh My Zsh
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "{{ target_home }}/.oh-my-zsh"
    depth: 1
    update: false
  become: false
  environment:
    HOME: "{{ target_home }}"

- name: Install Zsh plugins
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ target_home }}/.oh-my-zsh/custom/plugins/{{ item.name }}"
    depth: 1
    update: false
  loop:
    - name: zsh-autosuggestions
      repo: https://github.com/zsh-users/zsh-autosuggestions.git
    - name: zsh-syntax-highlighting
      repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
  become: false
  environment:
    HOME: "{{ target_home }}"

- name: Inspect the existing Zsh environment file
  ansible.builtin.stat:
    path: "{{ target_home }}/.zshenv"
  register: zshenv_file
  become: false

- name: Link Zsh environment configuration into the home directory
  ansible.builtin.file:
    src: "{{ target_home }}/.config/zsh/.zshenv"
    dest: "{{ target_home }}/.zshenv"
    state: link
    owner: "{{ target_user.stdout }}"
  become: false
  when: not zshenv_file.stat.exists or zshenv_file.stat.islnk

- name: Preserve an existing regular Zsh environment file
  ansible.builtin.debug:
    msg: >-
      Preserving {{ target_home }}/.zshenv because it is an existing regular
      file. Remove it and rerun the zsh role if you want Ansible to create the
      symlink.
  when: zshenv_file.stat.exists and not zshenv_file.stat.islnk
