---
- name: Install system dependencies for pyenv (Debian)
  apt:
    name:
      - make
      - build-essential
      - libssl-dev
      - zlib1g-dev
      - libbz2-dev
      - libreadline-dev
      - libsqlite3-dev
      - wget
      - curl
      - llvm
      - libncursesw5-dev
      - xz-utils
      - tk-dev
      - libxml2-dev
      - libxmlsec1-dev
      - libffi-dev
      - liblzma-dev
      - git
    state: present
    update_cache: yes

- name: Show where pyenv was cloned
  debug:
    msg: "pyenv was cloned to: /home/myuser/.pyenv"

- name: Clone pyenv
  git:
    repo: 'https://github.com/pyenv/pyenv.git'
    dest: "{{ pyenv_root }}"
    update: no
  become: true
  become_user: "{{ target_user }}"

- name: Fix ownership of pyenv directory
  file:
    path: "{{ pyenv_root }}"
    state: directory
    recurse: yes
    owner: "{{ target_user }}"
    group: "{{ target_user }}"

- name: Install Python {{ python_version }} with pyenv
  shell: |
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init --path)"
    pyenv install -s {{ python_version }}
    pyenv global {{ python_version }}
  args:
    executable: /bin/bash
  environment:
    PYENV_ROOT: "{{ pyenv_root }}"
  become: true
  become_user: "{{ target_user }}"

- name: Create venv for Poetry
  shell: |
    {{ pyenv_root }}/versions/{{ python_version }}/bin/python -m venv {{ venv_path }}/poetry
    {{ venv_path }}/poetry/bin/pip install -U pip setuptools
    {{ venv_path }}/poetry/bin/pip install poetry
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ target_user }}"

- name: Install uv using pip from pyenv
  shell: |
    {{ pyenv_root }}/versions/{{ python_version }}/bin/python -m venv {{ venv_path }}/uv
    {{ venv_path }}/uv/bin/pip install -U pip setuptools
    {{ venv_path }}/uv/bin/pip install uv
  become: true
  become_user: "{{ target_user }}"
