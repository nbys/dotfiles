---
- name: Include OS-specific task file
  include_tasks: "{{ ansible_os_family }}.yml"

- name: Show where pyenv was cloned
  debug:
    msg: "pyenv will be installed at {{ target_home }}/.pyenv"

- name: Clone pyenv
  git:
    repo: 'https://github.com/pyenv/pyenv.git'
    dest: "{{ target_home }}/.pyenv"
    update: no
  become: false

- name: Fix ownership of pyenv directory
  file:
    path: "{{ target_home }}/.pyenv"
    state: directory
    recurse: yes
    owner: "{{ target_user.stdout }}"
    group: "{{ target_group }}"
    mode: '0755'

- name: Install Python {{ python_version }} with pyenv
  shell: |
    export PYENV_ROOT="{{ target_home }}/.pyenv"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init --path)"
    pyenv install -s {{ python_version }}
    pyenv global {{ python_version }}
  args:
    executable: /bin/bash
  environment:
    PYENV_ROOT: "{{ target_home }}/.pyenv"
    PATH: "{{ homebrew_prefix }}/bin:{{ ansible_facts['env']['PATH'] }}"
  become: false

- name: Create venv for Poetry
  shell: |
    {{ target_home }}/.pyenv/versions/{{ python_version }}/bin/python -m venv {{ target_home }}/.venvs/poetry
    {{ target_home }}/.venvs/poetry/bin/pip install -U pip setuptools
    {{ target_home }}/.venvs/poetry/bin/pip install poetry
  args:
    executable: /bin/bash
  become: false

- name: Install uv using pip from pyenv
  shell: |
    {{ target_home }}/.pyenv/versions/{{ python_version }}/bin/python -m venv {{ target_home }}/.venvs/uv
    {{ target_home }}/.venvs/uv/bin/pip install -U pip setuptools
    {{ target_home }}/.venvs/uv/bin/pip install uv
  become: false

- name: Fix ownership of pyenv directory
  file:
    path: "{{ target_home }}/.pyenv"
    state: directory
    recurse: yes
    owner: "{{ target_user.stdout }}"
    group: "{{ target_group }}"
    mode: '0755'

