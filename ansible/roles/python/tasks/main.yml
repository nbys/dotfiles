---
- name: Include OS-specific task file
  ansible.builtin.include_tasks: "{{ ansible_facts['os_family'] }}.yml"

- name: Show where pyenv was cloned
  debug:
    msg: "pyenv will be installed at {{ target_home }}/.pyenv"

- name: Clone pyenv
  ansible.builtin.git:
    repo: 'https://github.com/pyenv/pyenv.git'
    dest: "{{ target_home }}/.pyenv"
    update: true
  become: false

- name: Fix ownership of pyenv directory
  ansible.builtin.file:
    path: "{{ target_home }}/.pyenv"
    state: directory
    recurse: yes
    owner: "{{ target_user.stdout }}"
    group: "{{ target_group }}"
  become: true

- name: Check whether Python {{ python_version }} is installed
  become: false
  ansible.builtin.stat:
    path: "{{ target_home }}/.pyenv/versions/{{ python_version }}/bin/python"
  register: requested_python

- name: Detect the selected pyenv Python version
  become: false
  ansible.builtin.command: "{{ target_home }}/.pyenv/bin/pyenv version-name"
  environment:
    PYENV_ROOT: "{{ target_home }}/.pyenv"
  register: selected_python_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install Python {{ python_version }} with pyenv
  ansible.builtin.shell: |
    export PYENV_ROOT="{{ target_home }}/.pyenv"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init --path)"
    pyenv install {{ python_version }}
  args:
    executable: /bin/bash
  environment:
    PYENV_ROOT: "{{ target_home }}/.pyenv"
    PATH: "{{ homebrew_prefix }}/bin:{{ ansible_facts['env']['PATH'] }}"
  become: false
  when: not requested_python.stat.exists

- name: Select Python {{ python_version }} as the pyenv global
  become: false
  ansible.builtin.command: "{{ target_home }}/.pyenv/bin/pyenv global {{ python_version }}"
  environment:
    PYENV_ROOT: "{{ target_home }}/.pyenv"
  when: selected_python_version.stdout != python_version

- name: Detect the Poetry virtual environment Python version
  become: false
  ansible.builtin.command: "{{ target_home }}/.venvs/poetry/bin/python --version"
  register: poetry_python_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Create venv for Poetry
  ansible.builtin.command: >-
    {{ target_home }}/.pyenv/versions/{{ python_version }}/bin/python
    -m venv --clear {{ target_home }}/.venvs/poetry
  become: false
  when: poetry_python_version.stdout != 'Python ' ~ python_version

- name: Install or update Poetry
  become: false
  ansible.builtin.command: >-
    {{ target_home }}/.venvs/poetry/bin/pip install --upgrade
    pip setuptools poetry
  register: poetry_package_update
  changed_when: "'Successfully installed' in poetry_package_update.stdout"

- name: Detect the uv virtual environment Python version
  become: false
  ansible.builtin.command: "{{ target_home }}/.venvs/uv/bin/python --version"
  register: uv_python_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Create venv for uv
  ansible.builtin.command: >-
    {{ target_home }}/.pyenv/versions/{{ python_version }}/bin/python
    -m venv --clear {{ target_home }}/.venvs/uv
  become: false
  when: uv_python_version.stdout != 'Python ' ~ python_version

- name: Install or update uv
  become: false
  ansible.builtin.command: >-
    {{ target_home }}/.venvs/uv/bin/pip install --upgrade
    pip setuptools uv
  register: uv_package_update
  changed_when: "'Successfully installed' in uv_package_update.stdout"

- name: Verify the requested Python version
  become: false
  ansible.builtin.command: "{{ target_home }}/.pyenv/versions/{{ python_version }}/bin/python --version"
  register: python_version_after
  changed_when: false
  failed_when: >-
    not ansible_check_mode and
    (python_version_after.rc != 0 or
     python_version_after.stdout != 'Python ' ~ python_version)
  check_mode: false

- name: Show the installed Python version
  ansible.builtin.debug:
    msg:
      tool: Python
      requested: "{{ python_version }}"
      installed: "{{ python_version_after.stdout }}"
  when: python_version_after.rc == 0

