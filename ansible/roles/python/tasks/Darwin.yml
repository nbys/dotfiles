---
- name: Check Python build dependencies from Homebrew
  become: false
  ansible.builtin.command: "{{ homebrew_bin }} list --versions {{ item }}"
  loop:
    - libffi
    - openssl@3
    - pkg-config
    - readline
    - sqlite
    - tcl-tk
    - xz
    - zlib
  register: python_homebrew_dependency_checks
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install missing Python build dependencies from Homebrew
  become: false
  ansible.builtin.command: "{{ homebrew_bin }} install {{ item.item }}"
  loop: "{{ python_homebrew_dependency_checks.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0
