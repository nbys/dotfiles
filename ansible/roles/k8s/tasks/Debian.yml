- name: Ensure dependencies are present
  apt:
    name:
      - curl
    state: present
    update_cache: true

- name: Download kubectl binary
  get_url:
    url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/{{ kubectl_arch }}/kubectl"
    dest: /tmp/kubectl
    mode: '0755'

- name: Download kubectl checksum
  get_url:
    url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/{{ kubectl_arch }}/kubectl.sha256"
    dest: /tmp/kubectl.sha256
    mode: '0644'

- name: Verify kubectl checksum
  shell: |
    echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum --check
  register: checksum_result
  failed_when: "'OK' not in checksum_result.stdout"

- name: Install kubectl binary
  copy:
    src: /tmp/kubectl
    dest: /usr/local/bin/kubectl
    remote_src: yes
    owner: root
    group: root
    mode: '0755'


- name: Download Helm install script
  get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get_helm.sh
    mode: '0755'

- name: Install Helm
  command: /tmp/get_helm.sh
  args:
    creates: /usr/local/bin/helm
