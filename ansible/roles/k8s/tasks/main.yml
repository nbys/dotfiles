- name: Detect the installed kubectl version
  become: false
  ansible.builtin.command: kubectl version --client
  environment:
    PATH: "{{ homebrew_prefix }}/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"
  register: kubectl_version_before
  changed_when: false
  failed_when: false
  check_mode: false

- name: Decide whether kubectl needs to be updated
  ansible.builtin.set_fact:
    kubectl_needs_update: >-
      {{ kubectl_version_before.rc != 0 or
         (kubectl_version | string) not in kubectl_version_before.stdout }}

- name: Detect system architecture
  ansible.builtin.set_fact:
    kubectl_arch: >-
      {{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else 'unsupported' }}

- name: Fail if unsupported architecture
  ansible.builtin.fail:
    msg: "Unsupported architecture: {{ ansible_facts['architecture'] }}"
  when: kubectl_arch == 'unsupported'

- name: Include OS-specific tasks
  ansible.builtin.include_tasks: "{{ ansible_facts['os_family'] }}.yml"

- name: Verify the requested kubectl version
  become: false
  ansible.builtin.command: kubectl version --client
  environment:
    PATH: "{{ homebrew_prefix }}/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"
  register: kubectl_version_after
  changed_when: false
  failed_when: >-
    not ansible_check_mode and
    (kubectl_version_after.rc != 0 or
     (kubectl_version | string) not in kubectl_version_after.stdout)
  check_mode: false
