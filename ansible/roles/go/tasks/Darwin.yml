---
- name: Check Go Homebrew package
  become: false
  ansible.builtin.command: "{{ homebrew_bin }} list --versions go"
  register: go_homebrew_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install Go
  become: false
  ansible.builtin.command: "{{ homebrew_bin }} install go"
  when: go_homebrew_check.rc != 0
