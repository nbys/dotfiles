---
- name: Detect architecture
  ansible.builtin.command: uname -m
  register: arch_raw
  changed_when: false

- name: Map architecture to Go's format
  ansible.builtin.set_fact:
    go_arch: >-
      {{ 'amd64' if arch_raw.stdout == 'x86_64' else
         'arm64' if arch_raw.stdout in ['aarch64', 'arm64'] else
         'unsupported' }}

- name: Fail if architecture is unsupported
  ansible.builtin.fail:
    msg: "Unsupported architecture: {{ arch_raw.stdout }}"
  when: go_arch == 'unsupported'

- name: Set Go download details
  ansible.builtin.set_fact:
    go_filename: "go{{ go_version }}.linux-{{ go_arch }}.tar.gz"
    go_url: "https://go.dev/dl/go{{ go_version }}.linux-{{ go_arch }}.tar.gz"
    go_install_dir: "/usr/local/lib/go-{{ go_version }}"

- name: Download Go {{ go_version }}
  ansible.builtin.get_url:
    url: "{{ go_url }}"
    dest: "/tmp/{{ go_filename }}"
    mode: "0644"
  when: go_needs_update

- name: Create the versioned Go installation directory
  ansible.builtin.file:
    path: "{{ go_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: go_needs_update

- name: Extract Go {{ go_version }}
  ansible.builtin.unarchive:
    src: "/tmp/{{ go_filename }}"
    dest: "{{ go_install_dir }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    creates: "{{ go_install_dir }}/bin/go"
  when: go_needs_update

- name: Select Go {{ go_version }}
  ansible.builtin.file:
    src: "{{ go_install_dir }}/bin/go"
    dest: /usr/local/bin/go
    state: link
    force: true
  when: go_needs_update
