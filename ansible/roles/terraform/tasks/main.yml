---
- name: Detect the installed Terraform version
  become: false
  ansible.builtin.command: terraform version
  environment:
    PATH: "{{ homebrew_prefix }}/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"
  register: terraform_version_before
  changed_when: false
  failed_when: false
  check_mode: false

- name: Decide whether Terraform needs to be updated
  ansible.builtin.set_fact:
    terraform_needs_update: >-
      {{ terraform_version_before.rc != 0 or
         (terraform_version_before.stdout_lines | default([]) | first | default('')) !=
         'Terraform v' ~ terraform_version }}

- name: Include OS-specific tasks
  ansible.builtin.include_tasks: "{{ ansible_facts['os_family'] }}.yml"

- name: Verify the requested Terraform version
  become: false
  ansible.builtin.command: terraform version
  environment:
    PATH: "{{ homebrew_prefix }}/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"
  register: terraform_version_after
  changed_when: false
  failed_when: >-
    not ansible_check_mode and
    (terraform_version_after.rc != 0 or
     (terraform_version_after.stdout_lines | default([]) | first | default('')) !=
     'Terraform v' ~ terraform_version)
  check_mode: false
