---
- name: Check Terraform Homebrew package
  become: false
  ansible.builtin.command: "{{ homebrew_bin }} list --versions hashicorp/tap/terraform"
  register: terraform_homebrew_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install Terraform
  become: false
  ansible.builtin.command: "{{ homebrew_bin }} install hashicorp/tap/terraform"
  when:
    - terraform_needs_update
    - terraform_homebrew_check.rc != 0

- name: Update Terraform
  become: false
  ansible.builtin.command: "{{ homebrew_bin }} upgrade hashicorp/tap/terraform"
  when:
    - terraform_needs_update
    - terraform_homebrew_check.rc == 0
