---
- name: Install Docker
  include_tasks: "roles/docker/tasks/{{ ansible_os_family }}.yml"

- name: Start and enable Docker service
  systemd:
    name: docker
    state: started
    enabled: yes
  register: docker_service_status
  failed_when: false
  when: ansible_virtualization_type not in ["docker", "container", "containerd", "podman"]

- name: Log Docker service failure (if any)
  debug:
    msg: "Warning: Docker service failed to start. Check logs manually."
  when: docker_service_status is failed

