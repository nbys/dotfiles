---
- name: Check whether Docker Desktop is installed
  become: false
  ansible.builtin.command: "{{ homebrew_bin }} list --cask --versions docker"
  register: docker_desktop_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install Docker Desktop
  become: false
  ansible.builtin.command: "{{ homebrew_bin }} install --cask docker"
  when: docker_desktop_check.rc != 0

- name: Explain how to start Docker Desktop
  ansible.builtin.debug:
    msg: "Docker Desktop is installed. Open it once from Applications to finish setup."
  when:
    - docker_desktop_check.rc != 0
    - not ansible_check_mode
