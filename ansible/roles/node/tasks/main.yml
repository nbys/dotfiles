- name: Include OS-specific Node.js installation
  ansible.builtin.include_tasks: "{{ ansible_os_family }}.yml"

- name: Install global npm packages using shell
  shell: |
    npm install -g tree-sitter-cli typescript dockerfile-language-server-nodejs
  args:
    executable: /bin/bash
  become: "{{ ansible_facts['os_family'] != 'Darwin' }}"
  environment:
    PATH: "{{ homebrew_prefix }}/opt/node@{{ nodejs_version }}/bin:{{ ansible_facts['env']['PATH'] }}"
