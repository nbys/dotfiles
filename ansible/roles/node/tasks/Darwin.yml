---
- name: Check Node.js {{ nodejs_version }}
  become: false
  ansible.builtin.command: "{{ homebrew_bin }} list --versions node@{{ nodejs_version }}"
  register: node_homebrew_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install Node.js {{ nodejs_version }}
  become: false
  ansible.builtin.command: "{{ homebrew_bin }} install node@{{ nodejs_version }}"
  when: node_homebrew_check.rc != 0

- name: Link Node.js {{ nodejs_version }} into Homebrew's prefix
  become: false
  ansible.builtin.command: "{{ homebrew_bin }} link --overwrite --force node@{{ nodejs_version }}"
  register: node_homebrew_link
  changed_when: >-
    'Already linked' not in
    (node_homebrew_link.stdout + node_homebrew_link.stderr)
