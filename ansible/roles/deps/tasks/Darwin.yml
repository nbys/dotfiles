---
- name: Check common Homebrew dependencies
  become: false
  ansible.builtin.command: "{{ homebrew_bin }} list --versions {{ item }}"
  loop:
    - bzip2
    - cmake
    - coreutils
    - curl
    - findutils
    - gcc
    - git
    - libffi
    - openssl@3
    - pkg-config
    - readline
    - sqlite
    - wget
    - xz
  register: homebrew_dependency_checks
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install missing common Homebrew dependencies
  become: false
  ansible.builtin.command: "{{ homebrew_bin }} install {{ item.item }}"
  loop: "{{ homebrew_dependency_checks.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0
