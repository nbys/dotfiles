---
- name: Update Homebrew metadata
  become: false
  ansible.builtin.command: "{{ homebrew_bin }} update"
  register: homebrew_update
  changed_when: "'Already up-to-date.' not in homebrew_update.stdout"

- name: Check for outdated Homebrew packages
  become: false
  ansible.builtin.command: "{{ homebrew_bin }} outdated --quiet"
  register: outdated_homebrew_packages
  changed_when: false
  failed_when: false
  check_mode: false

- name: Upgrade outdated Homebrew packages
  become: false
  ansible.builtin.command: "{{ homebrew_bin }} upgrade"
  when: outdated_homebrew_packages.stdout | trim | length > 0

- name: Check common Homebrew dependencies
  become: false
  ansible.builtin.command: "{{ homebrew_bin }} list --versions {{ item }}"
  loop:
    - bzip2
    - cmake
    - coreutils
    - curl
    - findutils
    - gcc
    - git
    - libffi
    - openssl@3
    - pkg-config
    - readline
    - sqlite
    - wget
    - xz
  register: homebrew_dependency_checks
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install missing common Homebrew dependencies
  become: false
  ansible.builtin.command: "{{ homebrew_bin }} install {{ item.item }}"
  loop: "{{ homebrew_dependency_checks.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0
