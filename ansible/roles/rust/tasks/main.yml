---
- name: Download rustup installer script
  become: false
  get_url:
    url: https://sh.rustup.rs
    dest: "{{ target_home }}/rustup-init.sh"
    mode: "0755"

- name: Install rustup and stable toolchain
  become: false
  shell: |
    set -e
    ./rustup-init.sh -y --profile default --default-toolchain stable
    export PATH="$HOME/.cargo/bin:$PATH"
    rustup show
    rustup default stable
    cargo --version
    rustc --version
  args:
    chdir: "{{ target_home }}"
    executable: /bin/bash
    creates: "{{ target_home }}/.cargo/bin/cargo"
  environment:
    HOME: "{{ target_home }}"
    USER: "{{ target_user.stdout }}"
    CARGO_HOME: "{{ target_home }}/.cargo"
    RUSTUP_HOME: "{{ target_home }}/.rustup"

- name: Remove rustup-init script after install
  become: false
  file:
    path: "{{ target_home }}/rustup-init.sh"
    state: absent
