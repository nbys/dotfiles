---
- name: Ensure curl is installed
  package:
    name: curl
    state: present

- name: Install rustup (Rust installer)
  shell: |
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
  args:
    executable: /bin/bash
  environment:
    CARGO_HOME: "/home/{{ target_user }}/.cargo"
    RUSTUP_HOME: "/home/{{ target_user }}/.rustup"
  become: false
  become_user: "{{ target_user }}"

- name: Ensure correct ownership of .cargo directory
  file:
    path: "/home/{{ target_user }}/.cargo"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    recurse: yes
  become: true
