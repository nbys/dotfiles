---
- name: Ensure apt cache is updated
  apt:
    update_cache: yes

- name: Install common CLI tools on Debian
  apt:
    name:
      - bat
      - fzf
      - ripgrep
      - fd-find
      - tmux
      - tree
    state: present

- name: Create symlink for fd (bat and fd sometimes installed under non-standard names)
  file:
    src: /usr/bin/fdfind
    dest: /usr/local/bin/fd
    state: link
    force: yes
