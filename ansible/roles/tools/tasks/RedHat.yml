---
- name: Install ripgrep from source with cargo
  git:
    repo: https://github.com/BurntSushi/ripgrep.git
    dest: /tmp/ripgrep
    version: master

- name: Build and install ripgrep with cargo
  shell: |
    /home/{{ target_user.stdout }}/.cargo/bin/cargo install --path .
  args:
    chdir: /tmp/ripgrep
    executable: /bin/bash
  environment:
    HOME: "/home/{{ target_user.stdout }}"
    USER: "{{ target_user.stdout }}"
    CARGO_HOME: "/home/{{ target_user.stdout }}/.cargo"
    PATH: "/home/{{ target_user.stdout }}/.cargo/bin:{{ ansible_env.PATH }}"

- name: Clone fzf from GitHub
  git:
    repo: https://github.com/junegunn/fzf.git
    dest: "/home/{{ target_user.stdout }}/.fzf"
    version: master

- name: Install fzf (run install script)
  shell: |
    ./install --bin
  args:
    chdir: "/home/{{ target_user.stdout }}/.fzf"
    executable: /bin/bash

- name: Clone fd from GitHub
  git:
    repo: https://github.com/sharkdp/fd.git
    dest: /tmp/fd
    version: master

- name: Build and install fd using cargo
  shell: |
    /home/{{ target_user.stdout }}/.cargo/bin/cargo install --path .
  args:
    chdir: /tmp/fd
    executable: /bin/bash
  environment:
    HOME: "/home/{{ target_user.stdout }}"
    USER: "{{ target_user.stdout }}"
    CARGO_HOME: "/home/{{ target_user.stdout }}/.cargo"
    PATH: "/home/{{ target_user.stdout }}/.cargo/bin:{{ ansible_env.PATH }}"
