---
- name: Check Erlang Homebrew packages
  become: false
  ansible.builtin.command: "{{ homebrew_bin }} list --versions {{ item }}"
  loop:
    - erlang
    - rebar3
  register: erlang_homebrew_checks
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install missing Erlang Homebrew packages
  become: false
  ansible.builtin.command: "{{ homebrew_bin }} install {{ item.item }}"
  loop: "{{ erlang_homebrew_checks.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0

- name: Update Erlang/OTP
  become: false
  ansible.builtin.command: "{{ homebrew_bin }} upgrade erlang"
  when:
    - item.item == 'erlang'
    - item.rc == 0
  loop: "{{ erlang_homebrew_checks.results }}"
  loop_control:
    label: "{{ item.item }}"
