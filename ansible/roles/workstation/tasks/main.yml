---
- name: Install Fedora workstation support packages
  ansible.builtin.dnf:
    name:
      - curl
      - fontconfig
      - xz
    state: present

- name: Configure the Ghostty Fedora COPR
  ansible.builtin.get_url:
    url: >-
      https://copr.fedorainfracloud.org/coprs/scottames/ghostty/repo/fedora-{{ ansible_facts['distribution_major_version'] }}/scottames-ghostty-fedora-{{ ansible_facts['distribution_major_version'] }}.repo
    dest: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:scottames:ghostty.repo
    owner: root
    group: root
    mode: '0644'

- name: Install Ghostty on Fedora
  ansible.builtin.dnf:
    name: ghostty
    state: present
    update_cache: true

- name: Create the Iosevka Nerd Font directory
  ansible.builtin.file:
    path: "{{ target_home }}/.local/share/fonts/IosevkaNerdFont"
    state: directory
    owner: "{{ target_user.stdout }}"
    group: "{{ target_group }}"
    mode: '0755'
  become: false

- name: Check the installed Iosevka Nerd Font version
  ansible.builtin.stat:
    path: >-
      {{ target_home }}/.local/share/fonts/IosevkaNerdFont/.version-{{ nerd_fonts_version }}
  register: iosevka_nerd_font
  become: false

- name: Download Iosevka Nerd Font
  ansible.builtin.get_url:
    url: >-
      https://github.com/ryanoasis/nerd-fonts/releases/download/v{{ nerd_fonts_version }}/Iosevka.tar.xz
    dest: "/tmp/Iosevka-{{ nerd_fonts_version }}.tar.xz"
    checksum: "sha256:{{ nerd_fonts_iosevka_sha256 }}"
    mode: '0644'
  when: not iosevka_nerd_font.stat.exists

- name: Install Iosevka Nerd Font
  ansible.builtin.unarchive:
    src: "/tmp/Iosevka-{{ nerd_fonts_version }}.tar.xz"
    dest: "{{ target_home }}/.local/share/fonts/IosevkaNerdFont"
    remote_src: true
    owner: "{{ target_user.stdout }}"
    group: "{{ target_group }}"
  when: not iosevka_nerd_font.stat.exists

- name: Record the installed Iosevka Nerd Font version
  ansible.builtin.copy:
    content: "{{ nerd_fonts_version }}\n"
    dest: >-
      {{ target_home }}/.local/share/fonts/IosevkaNerdFont/.version-{{ nerd_fonts_version }}
    owner: "{{ target_user.stdout }}"
    group: "{{ target_group }}"
    mode: '0644'
  register: iosevka_nerd_font_marker
  when: not iosevka_nerd_font.stat.exists

- name: Refresh the user's font cache
  ansible.builtin.command: fc-cache --force
  become: false
  changed_when: true
  when: iosevka_nerd_font_marker is changed

- name: Check whether Zed is installed
  ansible.builtin.stat:
    path: "{{ target_home }}/.local/bin/zed"
  register: zed_binary
  become: false

- name: Create the user cache directory
  ansible.builtin.file:
    path: "{{ target_home }}/.cache"
    state: directory
    owner: "{{ target_user.stdout }}"
    group: "{{ target_group }}"
    mode: '0700'
  become: false

- name: Download the official Zed installer
  ansible.builtin.get_url:
    url: https://zed.dev/install.sh
    dest: "{{ target_home }}/.cache/zed-install.sh"
    owner: "{{ target_user.stdout }}"
    group: "{{ target_group }}"
    mode: '0755'
  become: false
  when: not zed_binary.stat.exists

- name: Install Zed for the target user
  ansible.builtin.command: "{{ target_home }}/.cache/zed-install.sh"
  environment:
    HOME: "{{ target_home }}"
  become: false
  when: not zed_binary.stat.exists
