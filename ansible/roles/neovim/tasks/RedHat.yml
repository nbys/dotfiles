---
- name: Detect system architecture
  ansible.builtin.command: uname -m
  register: system_architecture
  changed_when: false
  when: neovim_needs_update

- name: Set architecture-specific Neovim tarball
  ansible.builtin.set_fact:
    neovim_arch: >-
      {%- if system_architecture.stdout == "x86_64" -%}
        linux-x86_64
      {%- elif system_architecture.stdout in ["aarch64", "arm64"] -%}
        linux-arm64
      {%- else -%}
        unsupported
      {%- endif -%}
  when: neovim_needs_update

- name: Install Development Tools
  ansible.builtin.yum:
    name: "@Development tools"
    state: present
  when: neovim_needs_update

- name: Install dependencies for Neovim
  ansible.builtin.yum:
    name:
      - tar
      - gcc
      - gcc-c++
      - make
      - glibc-devel
      - glibc-headers
      - libstdc++-devel
      - wget
      - tar
      - bzip2
      - gzip
      - xz
    state: present
  when: neovim_needs_update

- name: Download Neovim tarball
  ansible.builtin.get_url:
    url: "https://github.com/neovim/neovim/releases/download/{{ neovim_version }}/nvim-{{ neovim_arch }}.tar.gz"
    dest: "/tmp/nvim-{{ neovim_version }}-{{ neovim_arch }}.tar.gz"
  when: neovim_needs_update

- name: Verify downloaded Neovim tarball
  ansible.builtin.command: ls -lh /tmp/nvim-{{ neovim_version }}-{{ neovim_arch }}.tar.gz
  register: tarball_check
  changed_when: false
  when: neovim_needs_update

- name: Extract Neovim tarball
  ansible.builtin.unarchive:
    src: "/tmp/nvim-{{ neovim_version }}-{{ neovim_arch }}.tar.gz"
    dest: "/usr/local"
    remote_src: yes
  when: neovim_needs_update

- name: Create symlink for Neovim
  ansible.builtin.file:
    src: "/usr/local/nvim-{{ neovim_arch }}/bin/nvim"
    dest: "/usr/local/bin/nvim"
    state: link
  when: neovim_needs_update
