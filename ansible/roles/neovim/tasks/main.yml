---
- name: Detect the installed Neovim version
  become: false
  ansible.builtin.command: nvim --version
  environment:
    PATH: "{{ homebrew_prefix }}/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"
  register: neovim_version_before
  changed_when: false
  failed_when: false
  check_mode: false

- name: Decide whether Neovim needs to be updated
  ansible.builtin.set_fact:
    neovim_needs_update: >-
      {{ neovim_version_before.rc != 0 or
         (neovim_version_before.stdout_lines | default([]) | first | default('')) !=
         'NVIM ' ~ neovim_version }}

- name: Install or update Neovim
  ansible.builtin.include_tasks: "{{ platform_task_file }}"

- name: Verify the requested Neovim version
  become: false
  ansible.builtin.command: nvim --version
  environment:
    PATH: "{{ homebrew_prefix }}/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"
  register: neovim_version_after
  changed_when: false
  failed_when: >-
    not ansible_check_mode and
    (neovim_version_after.rc != 0 or
     (neovim_version_after.stdout_lines | default([]) | first | default('')) !=
     'NVIM ' ~ neovim_version)
  check_mode: false

- name: Show the installed Neovim version
  ansible.builtin.debug:
    msg:
      tool: Neovim
      requested: "{{ neovim_version }}"
      installed: >-
        {{ neovim_version_after.stdout_lines | default([]) | first | default('unknown') }}
  when: neovim_version_after.rc == 0

