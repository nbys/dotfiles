---
- name: Install build dependencies
  ansible.builtin.apt:
    name:
      - ninja-build
      - gettext
      - cmake
      - unzip
      - curl
      - build-essential
      - git
    state: present
    update_cache: yes
  when: neovim_needs_update

- name: Clone Neovim repository
  ansible.builtin.git:
    repo: https://github.com/neovim/neovim.git
    dest: /tmp/neovim
    version: "{{ neovim_version }}"
    depth: 1
    force: true
  when: neovim_needs_update

- name: Build Neovim
  ansible.builtin.command: make CMAKE_BUILD_TYPE=RelWithDebInfo
  args:
    chdir: /tmp/neovim
  when: neovim_needs_update

- name: Install Neovim
  ansible.builtin.command: make install
  args:
    chdir: /tmp/neovim
  become: true
  when: neovim_needs_update
