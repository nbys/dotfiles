---
- name: Install development tools
  hosts: localhost
  become: yes
  roles:
    - role: setup
      tags:
        - always
        - setup
    - role: deps
      tags: deps
    - role: workstation
      tags: workstation
      when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
    - role: node
      tags: node
    - role: rust
      tags: rust
    - role: tools
      tags: tools
    - role: docker
      tags: docker
    # - role: fish
    #   tags: fish
    - role: zsh
      tags: zsh
    - role: dotfiles
      tags:
        - dotfiles
        - zsh
      when: ansible_facts['distribution'] in ['Fedora', 'Ubuntu']
    - role: python
      tags: python
    - role: go
      tags: go
    - role: neovim
      tags: neovim
    - role: terraform
      tags: terraform
    - role: k8s
      tags: k8s


